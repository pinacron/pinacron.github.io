<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぴなくろん（Pinacron）</title>
<meta name="description" content="ぴなくろん（Pinacron／ピナクロン）の公式サイト。ボカロ曲をつくって投稿しています。">
<meta property="og:title" content="ぴなくろん（Pinacron）">
<meta property="og:description" content="ボカロ曲をつくって投稿しています。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pinacron.com/">
<meta name="theme-color" content="#ffd84a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --flesh:#ffd84a;      /* パイナップルの果肉 */
    --flesh-pale:#fff4bf;
    --rind:#c97a1e;       /* 皮 */
    --crown:#2f6b34;      /* 葉 */
    --crown-deep:#173d1c; /* 端末の背景 */
    --ink:#2a2412;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--flesh-pale);
    color:var(--ink);
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;
    font-size:17px;
    line-height:1.8;
  }
  a{color:inherit}
  :focus-visible{outline:3px solid var(--rind);outline-offset:3px;border-radius:4px}

  /* ---------- いちばん上：cron の一行 ---------- */
  .hero{
    background:
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(201,122,30,.22) 22px 24px),
      repeating-linear-gradient(-45deg, transparent 0 22px, rgba(201,122,30,.22) 22px 24px),
      var(--flesh);
    padding:56px 16px 64px;
    border-bottom:6px solid var(--crown);
  }
  .term{
    max-width:720px;
    margin:0 auto;
    background:var(--crown-deep);
    color:var(--flesh);
    border-radius:14px;
    box-shadow:0 6px 0 var(--crown);
    font-family:"DotGothic16",monospace;
    overflow:hidden;
  }
  .term-bar{
    display:flex;gap:7px;align-items:center;
    padding:10px 14px;
    background:var(--crown);
  }
  .term-bar i{width:11px;height:11px;border-radius:50%;background:var(--flesh);opacity:.85;display:block}
  .term-bar i:nth-child(2){opacity:.6}
  .term-bar i:nth-child(3){opacity:.35}
  .term-bar span{margin-left:8px;font-size:13px;color:var(--flesh-pale);opacity:.9}
  .term-body{padding:22px 22px 26px}
  .prompt{margin:0;font-size:15px;color:#cfe8b8}
  .cron{
    display:grid;
    grid-template-columns:repeat(5,auto) 1fr;
    column-gap:clamp(10px,3vw,22px);
    align-items:end;
    margin:18px 0 0;
  }
  .cron .f{
    font-size:clamp(28px,7vw,52px);
    line-height:1;
    text-align:center;
  }
  .cron .lbl{
    font-size:12px;
    text-align:center;
    color:#cfe8b8;
    padding-top:6px;
  }
  .name{
    grid-column:1 / -1;
    margin:22px 0 0;
    font-family:"M PLUS Rounded 1c",sans-serif;
    font-weight:800;
    font-size:clamp(48px,13vw,104px);
    line-height:1.05;
    letter-spacing:.02em;
    color:var(--flesh);
  }
  .name small{
    display:block;
    margin-top:10px;
    font-family:"DotGothic16",monospace;
    font-weight:400;
    font-size:clamp(16px,3.6vw,22px);
    letter-spacing:.06em;
    color:var(--flesh-pale);
  }
  .now{
    margin:18px 0 0;
    font-size:12px;
    color:#9cc58a;
  }
  .caret{display:inline-block;width:.6em;background:var(--flesh);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.caret{animation:none}}

  /* ---------- 本文 ---------- */
  main{max-width:720px;margin:0 auto;padding:44px 16px 24px}
  section+section{margin-top:44px}
  h2{
    font-size:22px;
    margin:0 0 14px;
    display:flex;align-items:center;gap:10px;
  }
  h2::before{
    content:"";width:14px;height:14px;
    background:var(--rind);
    transform:rotate(45deg);
    border-radius:2px;
    flex:none;
  }
  .intro p{margin:0}

  .links{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .links a,.links .soon{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:14px 18px;
    border:3px solid var(--crown);
    border-radius:12px;
    background:#fff;
    text-decoration:none;
    font-weight:700;
  }
  .links a{box-shadow:0 4px 0 var(--crown);transition:transform .08s,box-shadow .08s}
  .links a:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--crown)}
  .links a:active{transform:translateY(4px);box-shadow:none}
  .links .id{font-family:"DotGothic16",monospace;font-weight:400;font-size:15px;color:var(--crown)}
  .links .soon{border-style:dashed;color:#7a6f4e;background:transparent}
  .links .soon .id{color:#9a8f6a}

  .empty{
    margin:0;
    padding:18px;
    border-radius:12px;
    background:var(--crown-deep);
    color:var(--flesh-pale);
    font-family:"DotGothic16",monospace;
    font-size:15px;
    line-height:1.9;
  }
  .empty b{color:var(--flesh);font-weight:400}

  footer{
    max-width:720px;margin:0 auto;
    padding:28px 16px 40px;
    font-size:13px;color:#7a6f4e;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="term" role="img" aria-label="ターミナル画面に、cronの書式でぴなくろんの名前が表示されている">
    <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>crontab</span></div>
    <div class="term-body">
      <p class="prompt" aria-hidden="true">$ crontab -l</p>
      <div class="cron" aria-hidden="true">
        <div><div class="f" id="c-min">00</div><div class="lbl">分</div></div>
        <div><div class="f" id="c-hour">00</div><div class="lbl">時</div></div>
        <div><div class="f" id="c-day">*</div><div class="lbl">日</div></div>
        <div><div class="f" id="c-mon">*</div><div class="lbl">月</div></div>
        <div><div class="f" id="c-dow">*</div><div class="lbl">曜日</div></div>
        <div></div>
      </div>
      <h1 class="name">ぴなくろん<small>Pinacron ／ ピナクロン</small></h1>
      <p class="now" aria-hidden="true">いまの時刻（日本時間）をcronの書式で表示中<span class="caret">&nbsp;</span></p>
    </div>
  </div>
</header>

<main>
  <section class="intro" aria-labelledby="h-intro">
    <h2 id="h-intro">ぴなくろんについて</h2>
    <p>ボカロ曲をつくって、ニコニコ動画とYouTubeに投稿しています。</p>
  </section>

  <section aria-labelledby="h-links">
    <h2 id="h-links">リンク</h2>
    <ul class="links">
      <!-- アカウントができたら、各行の span.soon を a に差し替える -->
      <li><span class="soon">X<span class="id">準備中</span></span></li>
      <li><span class="soon">YouTube<span class="id">準備中</span></span></li>
      <li><span class="soon">ニコニコ動画<span class="id">準備中</span></span></li>
    </ul>
  </section>

  <section aria-labelledby="h-new">
    <h2 id="h-new">新着動画</h2>
    <p class="empty">&gt; ls ./videos<br><b>まだ投稿はありません。最初の曲を準備しています。</b></p>
  </section>
</main>

<footer>© 2026 Pinacron</footer>

<script>
  // ヒーローの cron 欄に、日本時間の「いま」を cron の5項目（分 時 日 月 曜日）で表示する
  (function(){
    var ids=["c-min","c-hour","c-day","c-mon","c-dow"];
    function tick(){
      var parts;
      try{
        var f=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",minute:"2-digit",hour:"2-digit",day:"numeric",month:"numeric",weekday:"short",hour12:false});
        var o={};f.formatToParts(new Date()).forEach(function(p){o[p.type]=p.value});
        var dow={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday];
        parts=[("0"+o.minute).slice(-2),("0"+(o.hour==="24"?"0":o.hour)).slice(-2),o.day,o.month,String(dow)];
      }catch(e){return}
      ids.forEach(function(id,i){var el=document.getElementById(id);if(el)el.textContent=parts[i]});
    }
    tick();
    setInterval(tick,15000);
  })();
</script>
</body>
</html>
